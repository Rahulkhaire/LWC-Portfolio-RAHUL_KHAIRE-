<template>
  <div class={themeClass}>
    <header class="nav">
      <a class="logo" href="#home" data-id="home" onclick={scrollTo} aria-label="Rahul Khaire — Home">
        <span class="logo-mark" aria-hidden="true">RK</span>
        <span class="logo-name">Rahul Khaire<span class="logo-dot">.</span></span>
      </a>
      <button class="menu-toggle" type="button" onclick={toggleMenu} aria-expanded={menuOpen} aria-controls="portfolio-navigation" aria-label={menuLabel}>
        <span aria-hidden="true">{menuIcon}</span>
      </button>
      <nav id="portfolio-navigation" class={navigationClass} aria-label="Main navigation">
        <template for:each={nav} for:item="item">
          <button key={item.id} type="button" data-id={item.id} onclick={scrollTo}>{item.label}</button>
        </template>
      </nav>
      <button class="theme-toggle" type="button" onclick={toggleTheme} aria-label={themeToggleLabel} title={themeToggleLabel}>
        <span aria-hidden="true">{themeIcon}</span> {themeToggleText}
      </button>
    </header>

    <template if:true={loading}>
      <div class="loading-state" role="status" aria-live="polite">Loading portfolio…</div>
    </template>
    <template if:true={loadError}>
      <div class="data-error" role="alert">Portfolio details couldn't load. Please refresh the page or contact the site administrator.</div>
    </template>

    <main>
      <section data-section="home" id="home" class="hero" aria-labelledby="hero-title">
        <div class="hero-text">
          <p class="hello">Salesforce Developer · AI &amp; Data Science</p>
          <h1 id="hero-title">Rahul Khaire</h1>
          <h2>{label.TITLE}</h2>
          <p class="lead">{label.INTRO}</p>
          <div class="btns hero-actions">
            <lightning-button variant="brand" label="View Projects" data-id="projects" onclick={scrollTo}></lightning-button>
            <a class="external-action brand-action" href={resumeUrl} download="Rahul_Khaire_Resume.pdf">Download Resume</a>
            <a class="external-action" href={resumeUrl} target="_blank" rel="noopener noreferrer">View Resume</a>
            <lightning-button label="Contact Me" data-id="contact" onclick={scrollTo}></lightning-button>
            <lightning-button label="View Salesforce Skills" data-id="skills" onclick={scrollTo}></lightning-button>
          </div>
          <div class="social-links" aria-label="Professional profiles">
            <a class="social-link" href={linkedInUrl} target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)"><lightning-icon icon-name="utility:link" alternative-text="" size="x-small"></lightning-icon><span>LinkedIn</span></a>
            <a class="social-link" href={githubUrl} target="_blank" rel="noopener noreferrer" aria-label="GitHub profile (opens in a new tab)"><lightning-icon icon-name="utility:code_playground" alternative-text="" size="x-small"></lightning-icon><span>GitHub</span></a>
            <a class="social-link" href={trailheadUrl} target="_blank" rel="noopener noreferrer" aria-label="Trailhead profile (opens in a new tab)"><lightning-icon icon-name="utility:trail" alternative-text="" size="x-small"></lightning-icon><span>Trailhead</span></a>
            <a class="social-link" href={emailUrl} aria-label="Email Rahul Khaire"><lightning-icon icon-name="utility:email" alternative-text="" size="x-small"></lightning-icon><span>Email</span></a>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="cloud c1">☁ Sales Cloud</div><div class="cloud c2">☁ Service Cloud</div><div class="cloud c3">✳ Agentforce</div><div class="cloud c4">⚡ LWC</div>
          <div class="core">Apex</div>
        </div>
        <div class="recruiter-snapshot" aria-label="Recruiter snapshot">
          <h2>Recruiter snapshot</h2>
          <div class="snapshot-items"><span>Salesforce Developer</span><span>Apex + LWC</span><span>Salesforce Integrations</span><span>Agentforce / AI</span><span>REST APIs</span><span>CRM Automation</span></div>
        </div>
        <div class="stats hero-stats" aria-label="Portfolio highlights">
          <div class="stat"><b>{counterDisplay.badges}</b><span>Trailhead Badges</span></div>
          <div class="stat"><b>{counterDisplay.supers}</b><span>Superbadges</span></div>
          <div class="stat"><b>{counterDisplay.projects}</b><span>Featured Projects</span></div>
          <div class="stat"><b>{counterDisplay.interns}</b><span>Internship Experiences</span></div>
        </div>
      </section>

      <section data-section="about" id="about" class="sec" aria-labelledby="about-title">
        <p class="eyebrow">Profile</p><h2 id="about-title" class="section-title">About Me</h2>
        <div class="grid2 about-grid">
          <div class="about-copy">
            <p>Salesforce Developer and AI enthusiast focused on building scalable CRM solutions, automation, Lightning Web Components, integrations, and AI-powered applications.</p>
            <p>With an academic background in Artificial Intelligence and Data Science, Rahul works across Salesforce development, platform automation, APIs and emerging AI capabilities.</p>
            <div class="chips"><span class="chip">Apex</span><span class="chip">Lightning Web Components</span><span class="chip">CRM Automation</span><span class="chip">REST APIs</span><span class="chip">Agentforce</span><span class="chip">AI &amp; Data Science</span></div>
          </div>
          <div class="snapshot-card">
            <h3>At a glance</h3>
            <ul class="snapshot-list">
              <li><span>Focus</span><strong>Salesforce development &amp; integrations</strong></li>
              <li><span>Education</span><strong>AI &amp; Data Science</strong></li>
              <li><span>Experience</span><strong>{counterDisplay.interns} internship experiences</strong></li>
              <li><span>Trailhead</span><strong>{counterDisplay.badges} badges · {counterDisplay.supers} superbadges</strong></li>
            </ul>
          </div>
        </div>
      </section>

      <section data-section="salesforce-development" id="salesforce-development" class="sec" aria-labelledby="salesforce-title">
        <p class="eyebrow">Platform practice</p><h2 id="salesforce-title" class="section-title">Salesforce Development</h2>
        <p class="section-intro">A practical view of the Salesforce ecosystem, connected to the project work and skills documented in this portfolio.</p>
        <div class="cards specialization-grid">
          <template for:each={salesforceSpecializations} for:item="item">
            <article key={item.name} class="card specialization-card">
              <div class="specialization-heading"><span class="specialization-icon" aria-hidden="true">{item.icon}</span><h3>{item.name}</h3></div>
              <p>{item.summary}</p><p class="evidence"><strong>Portfolio evidence</strong>{item.evidence}</p>
              <p class="use-case"><strong>Use case</strong>{item.useCase}</p>
            </article>
          </template>
        </div>
      </section>

      <section data-section="skills" id="skills" class="sec" aria-labelledby="skills-title">
        <p class="eyebrow">Capabilities</p><h2 id="skills-title" class="section-title">Skills</h2>
        <div class="tabs" role="tablist" aria-label="Skill categories">
          <template for:each={skillTabs} for:item="skill">
            <button key={skill.category} class={skill.cls} role="tab" aria-selected={skill.selected} data-idx={skill.idx} onclick={pickSkill}>{skill.icon} {skill.category}</button>
          </template>
        </div>
        <div class="cards skill-grid" role="tabpanel" aria-label="Selected skills">
          <template for:each={activeSkillItems} for:item="skill">
            <article key={skill.name} class="card skill-card"><span class="skill-check" aria-hidden="true">✓</span><h3>{skill.name}</h3><p>{skill.description}</p></article>
          </template>
        </div>
      </section>

      <section data-section="technical-highlights" id="technical-highlights" class="sec" aria-labelledby="highlights-title">
        <p class="eyebrow">Interview guide</p><h2 id="highlights-title" class="section-title">Technical Highlights</h2>
        <div class="cards highlight-grid">
          <template for:each={technicalHighlights} for:item="item">
            <article key={item.name} class="card highlight-card"><span class="highlight-mark" aria-hidden="true">✦</span><h3>{item.name}</h3><p>{item.example}</p></article>
          </template>
        </div>
      </section>

      <section data-section="experience" id="experience" class="sec" aria-labelledby="experience-title">
        <p class="eyebrow">Professional background</p><h2 id="experience-title" class="section-title">Experience</h2>
        <ol class="timeline experience-timeline">
          <template for:each={data.experience} for:item="item">
            <li key={item.id}><small>{item.period}</small><strong>{item.role}</strong><em>{item.company}</em><ul><template for:each={item.points} for:item="point"><li key={point}>{point}</li></template></ul></li>
          </template>
        </ol>
      </section>

      <section data-section="projects" id="projects" class="sec" aria-labelledby="projects-title">
        <p class="eyebrow">Selected work</p><h2 id="projects-title" class="section-title">Featured Projects</h2>
        <p class="section-intro">Salesforce solutions, integrations and data applications. External project links appear only when a project-specific URL is available.</p>
        <div class="cards project-grid">
          <template for:each={projects} for:item="project">
            <article key={project.id} class="card project">
              <div class="project-topline"><div class="pimg" aria-hidden="true">{project.icon}</div><span class="project-type">{project.type}</span></div>
              <h3>{project.title}</h3>
              <template if:true={project.organization}><p class="project-context">{project.organization} · {project.location}</p></template>
              <p>{project.description}</p>
              <div class="chips"><template for:each={project.technologies} for:item="technology"><span key={technology} class="chip">{technology}</span></template></div>
              <ul class="feat"><template for:each={project.features} for:item="feature"><li key={feature}>{feature}</li></template></ul>
              <div class="btns project-actions">
                <template if:true={project.hasGithub}><a class="external-action" href={project.githubUrl} target="_blank" rel="noopener noreferrer">GitHub</a></template>
                <template if:true={project.hasDemo}><a class="external-action" href={project.demoUrl} target="_blank" rel="noopener noreferrer">Live Demo</a></template>
                <lightning-button variant="brand" label="Project Details" data-id={project.id} onclick={openProject}></lightning-button>
              </div>
            </article>
          </template>
        </div>
      </section>

      <section data-section="certifications" id="certifications" class="sec" aria-labelledby="certifications-title">
        <p class="eyebrow">Credentials</p><h2 id="certifications-title" class="section-title">Certifications &amp; Learning</h2>
        <div class="cards certification-grid">
          <template for:each={certs} for:item="certification">
            <article key={certification.id} class="card cert"><div class="pimg" aria-hidden="true">✦</div><h3>{certification.name}</h3><p>{certification.issuer}</p>
              <template if:true={certification.hasDate}><small>{certification.date}</small></template>
              <template if:true={certification.hasUrl}><a class="text-link" href={certification.url} target="_blank" rel="noopener noreferrer">Verify credential</a></template>
            </article>
          </template>
        </div>
      </section>

      <section data-section="achievements" id="achievements" class="sec" aria-labelledby="achievements-title">
        <p class="eyebrow">Milestones</p><h2 id="achievements-title" class="section-title">Achievements</h2>
        <div class="cards achievement-grid">
          <article class="card achievement-card"><span class="achievement-icon" aria-hidden="true">✦</span><div><h3>Agentblazer Innovator</h3><p>Trailhead recognition listed in the portfolio achievements.</p></div></article>
          <article class="card achievement-card"><span class="achievement-icon" aria-hidden="true">⌘</span><div><h3>Salesforce AI Associate</h3><p>Salesforce AI credential listed in the portfolio certifications.</p></div></article>
          <article class="card achievement-card"><span class="achievement-icon" aria-hidden="true">⌘</span><div><h3>GitHub Foundation</h3><p>GitHub credential listed in the portfolio certifications.</p></div></article>
        </div>
      </section>

      <section data-section="trailhead" id="trailhead" class="sec achievements-section" aria-labelledby="trailhead-title">
        <p class="eyebrow">Trailhead journey</p><h2 id="trailhead-title" class="section-title">Salesforce Trailhead Journey</h2>
        <div class="stats achievement-stats">
          <div class="stat"><b>{counterDisplay.badges}</b><span>Badges</span></div><div class="stat"><b>{counterDisplay.supers}</b><span>Superbadges</span></div>
          <div class="stat"><b>{counterDisplay.points}</b><span>Points</span></div><div class="stat"><b>{counterDisplay.trails}</b><span>Trails</span></div>
        </div>
        <div class="chips achievement-chips"><template for:each={ranks} for:item="rank"><span key={rank} class="chip big">✦ {rank}</span></template></div>
        <a class="external-action brand-action" href={trailheadUrl} target="_blank" rel="noopener noreferrer">View Trailhead Profile</a>
      </section>

      <section data-section="education" id="education" class="sec" aria-labelledby="education-title">
        <p class="eyebrow">Academic background</p><h2 id="education-title" class="section-title">Education</h2>
        <ol class="timeline education-timeline"><template for:each={data.education} for:item="item"><li key={item.id}><small>{item.period}</small><strong>{item.degree}</strong><em>{item.school}</em><span class="score">{item.score}</span></li></template></ol>
      </section>

      <section data-section="contact" id="contact" class="sec contact-section" aria-labelledby="contact-title">
        <div class="contact-intro"><p class="eyebrow">Let's connect</p><h2 id="contact-title" class="section-title">Contact</h2><p>For Salesforce development, integration or AI opportunities, send a message or reach out directly.</p><a class="contact-email" href={emailUrl}><lightning-icon icon-name="utility:email" alternative-text="" size="small"></lightning-icon> rahul.khaire@mit.asia</a></div>
        <div class="form" aria-label="Contact form">
          <lightning-input class="cf" name="name" label="Name" required max-length="120" autocomplete="name" value={form.name} onchange={onField}></lightning-input>
          <lightning-input class="cf" name="email" type="email" label="Email" required max-length="80" autocomplete="email" value={form.email} onchange={onField}></lightning-input>
          <lightning-input class="cf" name="subject" label="Subject" required max-length="150" value={form.subject} onchange={onField}></lightning-input>
          <lightning-input class="cf" name="phone" type="tel" label="Phone (optional)" max-length="30" autocomplete="tel" value={form.phone} onchange={onField}></lightning-input>
          <lightning-textarea class="cf" name="message" label="Message" required max-length="5000" value={form.message} onchange={onField}></lightning-textarea>
          <div class="honeypot" aria-hidden="true"><label for="contact-website">Leave this field empty</label><input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off" value={honeypot} onchange={onHoneypotChange}></div>
          <lightning-button variant="brand" label={sendButtonLabel} onclick={submit} disabled={sending}></lightning-button>
          <p class="form-note">Your message is submitted securely through Salesforce. Required fields are marked by the form.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div><strong>Rahul Khaire</strong><span>Salesforce Developer | AI &amp; Data Science</span></div>
      <div class="footer-links"><a href={linkedInUrl} target="_blank" rel="noopener noreferrer">LinkedIn</a><a href={githubUrl} target="_blank" rel="noopener noreferrer">GitHub</a><a href={trailheadUrl} target="_blank" rel="noopener noreferrer">Trailhead</a><a href={emailUrl}>Email</a></div>
      <small>© 2026 Rahul Khaire · Built with LWC + Apex on Salesforce</small>
    </footer>

    <template if:true={selectedProject}><c-project-modal project={selectedProject} onclose={closeProject}></c-project-modal></template>
  </div>
</template>
